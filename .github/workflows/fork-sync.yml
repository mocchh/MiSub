name: Fork Sync

on:
  schedule:
    - cron: "0 22 * * *"     # 每天北京时间 06:00 执行
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync_with_upstream:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_PAT != '' && secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Configure Git and remotes
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          set -euo pipefail

          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout main || git checkout -b main

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/imzyb/MiSub.git
          else
            git remote add upstream https://github.com/imzyb/MiSub.git
          fi

          if [ -n "${SYNC_PAT:-}" ]; then
            git remote set-url origin "https://x-access-token:${SYNC_PAT}@github.com/${{ github.repository }}.git"
            echo "✅ 检测到 SYNC_PAT，将使用 PAT 推送（支持同步 .github/workflows）。"
          else
            echo "⚠️ 未配置 SYNC_PAT，将使用默认 GITHUB_TOKEN。"
          fi

          git fetch --prune origin main
          git fetch --prune upstream main

      - name: Merge upstream main while preserving fork commits
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          set -euo pipefail

          ORIGIN_SHA="$(git rev-parse origin/main)"
          UPSTREAM_SHA="$(git rev-parse upstream/main)"

          if git merge-base --is-ancestor "${UPSTREAM_SHA}" "${ORIGIN_SHA}"; then
            echo "✨ Fork 已包含上游全部提交，保留本地修复，无需同步。"
            exit 0
          fi

          if [ -z "${SYNC_PAT:-}" ]; then
            WORKFLOW_DIFF="$(git diff --name-only "${ORIGIN_SHA}...${UPSTREAM_SHA}" -- .github/workflows)"
            if [ -n "${WORKFLOW_DIFF}" ]; then
              echo "::notice title=Fork Sync skipped::上游包含 workflow 文件变更，默认 GITHUB_TOKEN 不能创建或更新 workflow 文件。请使用具备 repo + workflow 权限的凭据审查并合并上游更新，保留 fork 修复提交。"
              exit 0
            fi
          fi

          echo "🚀 正在合并上游 main，保留 fork 的修复提交。"
          git merge --ff-only origin/main
          if ! git merge --no-edit upstream/main; then
            git merge --abort
            echo "::error title=Fork Sync conflict::上游更新与 fork 修复冲突，已停止同步；请人工解决，线上 main 未被改写。"
            exit 1
          fi
          git push origin main
          echo "✅ 上游更新已合并，fork 修复提交已保留。"
